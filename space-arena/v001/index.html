<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space Arena v001</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; height:100%; background:#07080c; overflow:hidden; font-family: ui-monospace, Menlo, Consolas, monospace; color:#cfd3dc; }
  canvas#game { display:block; position:absolute; inset:0; }
  #hud { position:absolute; left:12px; top:10px; font-size:13px; pointer-events:none; text-shadow:0 1px 2px #000; line-height:1.5; }
  #hud .dim { opacity:.55; }
  #banner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700; pointer-events:none; text-shadow:0 2px 12px #000; opacity:0; transition:opacity .25s; }
  #banner.show { opacity:1; }

  /* ---- Tuning panel ---- */
  #tune { position:absolute; right:0; top:0; bottom:0; width:340px; background:rgba(10,12,18,.94); border-left:1px solid #1e2330; overflow-y:auto; padding:12px 14px 40px; box-sizing:border-box; font-size:12px; display:none; }
  #tune.open { display:block; }
  #tune h2 { margin:0 0 8px; font-size:14px; letter-spacing:.08em; color:#8fd3ff; }
  #tune h3 { margin:14px 0 6px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#7f8798; border-bottom:1px solid #1e2330; padding-bottom:3px; }
  #tune .row { display:grid; grid-template-columns: 1fr 120px 58px; gap:8px; align-items:center; margin:4px 0; }
  #tune .row label { color:#b8bfcc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #tune input[type=range] { width:100%; accent-color:#5ab0ff; }
  #tune input[type=number] { width:100%; background:#0f1219; border:1px solid #2a3140; color:#e6e9ef; padding:2px 4px; font:inherit; box-sizing:border-box; }
  #tune .bar { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  #tune button, #tune select { background:#182030; border:1px solid #2a3449; color:#dfe5f0; padding:4px 8px; font:inherit; cursor:pointer; border-radius:3px; }
  #tune button:hover { background:#22304a; }
  #tune .perf { background:#0b0e14; border:1px solid #1e2330; padding:6px 8px; margin-bottom:6px; line-height:1.4; }
  #tune .perf canvas { width:100%; height:44px; display:block; margin-top:4px; }
  #tune .note { color:#6f7787; font-size:11px; margin-top:8px; }
  #tune kbd { background:#1a2030; border:1px solid #2c3648; border-radius:3px; padding:0 4px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="banner"></div>
<div id="tune">
  <h2>TUNING <span style="float:right;color:#5a6274;font-size:11px">T to close</span></h2>
  <div class="perf" id="perf"></div>
  <div class="bar">
    <select id="presetSel"></select>
    <button id="btnSave">Save as…</button>
    <button id="btnReset">Reset</button>
    <button id="btnCopy">Copy JSON</button>
    <button id="btnRestart">Restart match</button>
  </div>
  <div id="tuneRows"></div>
  <div class="note">
    <kbd>WASD</kbd> move · mouse aim · <kbd>click</kbd>/<kbd>space</kbd> fire · <kbd>1</kbd> possess/release ship · gamepad: sticks + RT ·
    <kbd>R</kbd> restart · <kbd>H</kbd> debug overlay · <kbd>P</kbd> perf · <kbd>T</kbd> panel
  </div>
</div>

<script>
'use strict';
// =====================================================================
//  SCAFFOLD: tuning, rng, loop, perf, input, spatial hash
//  TOY:      space arena — 2 teams of ships, lasers, asteroids, dumb AI
// =====================================================================

const GAME_ID = 'space-arena';
const WORLD = { w: 1600, h: 900 };
const TAU = Math.PI * 2;

// ---------------------------------------------------------------- RNG
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(1);
const rr = (a, b) => a + rand() * (b - a);

// ------------------------------------------------------------- TUNING
// def(key, default, min, max, step, group). Access as T.key.
const T = {};
const META = [];
function def(key, v, min, max, step, group) { T[key] = v; META.push({ key, def: v, min, max, step, group }); }

def('shipsPerTeam',   4,    1,    8,   1,     'Match');
def('shipHp',         5,    1,   10,   1,     'Match');
def('asteroidCount',  12,   0,   40,   1,     'Match');
def('matchRestartSec',3,    0,   10,   0.5,   'Match');

def('thrust',         420,  50,  1500, 10,    'Ship');
def('maxSpeed',       380,  50,  1000, 10,    'Ship');
def('drag',           0.9,  0,   5,    0.05,  'Ship');
def('turnRate',       7,    0.5, 20,   0.25,  'Ship');
def('shipRadius',     14,   6,   30,   1,     'Ship');

def('fireCooldown',   0.3,  0.03,1,    0.01,  'Laser');
def('laserSpeed',     720,  100, 2000, 10,    'Laser');
def('laserLife',      1.1,  0.2, 4,    0.05,  'Laser');
def('laserSpread',    3,    0,   15,   0.25,  'Laser');  // degrees
def('recoil',         40,   0,   400,  5,     'Laser');

def('aiRange',        320,  60,  900,  10,    'AI');
def('aiOrbit',        230,  40,  600,  10,    'AI');
def('aiLead',         0.8,  0,   1.5,  0.05,  'AI');
def('aiAim',          12,   1,   60,   1,     'AI');      // degrees: fire if within
def('aiThink',        0.15, 0.02,1,    0.01,  'AI');      // seconds between decisions
def('aiRetreatHp',    1,    0,   5,    1,     'AI');
def('aiRetreatSec',   2.5,  0,   10,   0.25,  'AI');      // max time spent retreating before re-engaging
def('aiAvoid',        110,  0,   400,  10,    'AI');

def('astMinR',        22,   8,   80,   1,     'Asteroids');
def('astMaxR',        58,   8,   120,  1,     'Asteroids');
def('astSpeed',       45,   0,   300,  5,     'Asteroids');
def('astBounce',      0.9,  0,   1.5,  0.05,  'Asteroids');

def('particles',      1,    0,   1,    1,     'FX');
def('screenShake',    6,    0,   30,   1,     'FX');

const PRESETS = {
  default: {},
  floaty:  { thrust: 260, drag: 0.25, maxSpeed: 480, turnRate: 4 },
  arcade:  { thrust: 900, drag: 3.5, maxSpeed: 420, turnRate: 14, fireCooldown: 0.12, laserSpeed: 1000 },
  sniper:  { fireCooldown: 0.6, laserSpeed: 1400, laserLife: 2, laserSpread: 0, aiRange: 600, aiOrbit: 450, aiAim: 4 },
};
function applyTuning(obj) { for (const m of META) if (obj[m.key] !== undefined) T[m.key] = +obj[m.key]; }
function resetTuning() { for (const m of META) T[m.key] = m.def; }
function tuningJSON() { const o = {}; for (const m of META) o[m.key] = T[m.key]; return o; }
const LS_KEY = GAME_ID + '.tuning';
function loadTuning() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s) { applyTuning(s.values || {}); Object.assign(PRESETS, s.presets || {}); }
  } catch (e) {}
}
function saveTuning() {
  try {
    const custom = {}; for (const k in PRESETS) if (!['default','floaty','arcade','sniper'].includes(k)) custom[k] = PRESETS[k];
    localStorage.setItem(LS_KEY, JSON.stringify({ values: tuningJSON(), presets: custom }));
  } catch (e) {}
}

// -------------------------------------------------------------- PERF
const perf = { frame: 0, sim: 0, ai: 0, col: 0, render: 0, hist: new Float32Array(120), hi: 0, fps: 0, _acc: 0, _n: 0 };
function perfPush(ms) { perf.hist[perf.hi] = ms; perf.hi = (perf.hi + 1) % perf.hist.length; }

// ------------------------------------------------------------ SPATIAL HASH
class Grid {
  constructor(cell) { this.cell = cell; this.map = new Map(); }
  clear() { this.map.clear(); }
  key(x, y) { return ((x / this.cell) | 0) * 73856093 ^ ((y / this.cell) | 0) * 19349663; }
  insert(e) {
    const r = e.r, c = this.cell;
    const x0 = ((e.x - r) / c) | 0, x1 = ((e.x + r) / c) | 0, y0 = ((e.y - r) / c) | 0, y1 = ((e.y + r) / c) | 0;
    for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
      const k = gx * 73856093 ^ gy * 19349663;
      let b = this.map.get(k); if (!b) this.map.set(k, b = []); b.push(e);
    }
  }
  query(x, y, r, out) {
    out.length = 0; const c = this.cell;
    const x0 = ((x - r) / c) | 0, x1 = ((x + r) / c) | 0, y0 = ((y - r) / c) | 0, y1 = ((y + r) / c) | 0;
    for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
      const b = this.map.get(gx * 73856093 ^ gy * 19349663); if (!b) continue;
      for (let i = 0; i < b.length; i++) if (out.indexOf(b[i]) < 0) out.push(b[i]);
    }
    return out;
  }
}

// ------------------------------------------------------------ ENTITIES
const TEAMS = [
  { name: 'Cyan',   color: '#4fd8ff', dim: '#1f6f86' },
  { name: 'Orange', color: '#ff9b3d', dim: '#8a4f17' },
];
const S = { ships: [], lasers: [], asteroids: [], parts: [], t: 0, match: null, shake: 0 };
const grid = new Grid(80);
const qbuf = [];

function wrap(e) {
  if (e.x < 0) e.x += WORLD.w; else if (e.x >= WORLD.w) e.x -= WORLD.w;
  if (e.y < 0) e.y += WORLD.h; else if (e.y >= WORLD.h) e.y -= WORLD.h;
}
// shortest toroidal delta
function delta(ax, ay, bx, by) {
  let dx = bx - ax, dy = by - ay;
  if (dx > WORLD.w / 2) dx -= WORLD.w; else if (dx < -WORLD.w / 2) dx += WORLD.w;
  if (dy > WORLD.h / 2) dy -= WORLD.h; else if (dy < -WORLD.h / 2) dy += WORLD.h;
  return [dx, dy];
}
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

function makeShip(team, i, n) {
  const side = team === 0 ? 0.18 : 0.82;
  return {
    kind: 'ship', team, id: team * 10 + i, alive: true,
    x: WORLD.w * side, y: WORLD.h * ((i + 1) / (n + 1)), vx: 0, vy: 0,
    a: team === 0 ? 0 : Math.PI, r: T.shipRadius, hp: T.shipHp, cd: 0, hitFlash: 0,
    ctrl: null, ai: { state: 'HUNT', target: null, think: rr(0, T.aiThink), aimA: 0, retreated: 0 },
    intent: { mx: 0, my: 0, ax: 0, ay: 0, aim: false, fire: false },
    kills: 0,
  };
}
function makeAsteroid() {
  const r = rr(T.astMinR, T.astMaxR), a = rr(0, TAU), sp = rr(0.3, 1) * T.astSpeed;
  // keep spawn away from ship columns
  let x; do { x = rr(0, WORLD.w); } while (Math.abs(x - WORLD.w * 0.18) < 120 || Math.abs(x - WORLD.w * 0.82) < 120);
  const pts = []; const n = 7 + (rand() * 5 | 0);
  for (let i = 0; i < n; i++) pts.push(rr(0.7, 1.1));
  return { kind: 'ast', x, y: rr(0, WORLD.h), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r, a: rr(0, TAU), spin: rr(-0.6, 0.6), pts };
}
function spawnParticles(x, y, n, color, speed, life) {
  if (!T.particles || S.headless) return;
  for (let i = 0; i < n; i++) {
    const a = rr(0, TAU), sp = rr(0.2, 1) * speed;
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, maxLife: life, color });
  }
}

function startMatch(seed) {
  rand = mulberry32(seed ?? (Math.random() * 1e9 | 0));
  S.seed = seed;
  S.ships.length = 0; S.lasers.length = 0; S.asteroids.length = 0; S.parts.length = 0;
  S.t = 0; S.match = { over: false, winner: -1, duration: 0, restartIn: 0 };
  for (let tm = 0; tm < 2; tm++) for (let i = 0; i < T.shipsPerTeam; i++) S.ships.push(makeShip(tm, i, T.shipsPerTeam));
  for (let i = 0; i < T.asteroidCount; i++) S.asteroids.push(makeAsteroid());
  // re-attach human controllers to first ship of each team if they were attached
  for (const c of controllers) if (c.wantsShip != null) { const s = S.ships.find(s => s.team === c.wantsShip); if (s) s.ctrl = c; }
  if (!S.headless) hideBanner();
}

// ----------------------------------------------------------- CONTROLLERS
// A controller fills ship.intent each tick: mx,my = move vector (world), ax,ay = aim dir, fire.
const keys = {};
const mouse = { x: 0, y: 0, down: false };
const controllers = [];

const kbm = {
  name: 'keyboard+mouse', wantsShip: null,
  update(ship) {
    const it = ship.intent;
    it.mx = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
    it.my = (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0);
    const [dx, dy] = delta(ship.x, ship.y, mouse.x, mouse.y);
    it.ax = dx; it.ay = dy; it.aim = true;
    it.fire = mouse.down || !!keys['Space'];
  }
};
const pad = {
  name: 'gamepad', wantsShip: null, index: -1,
  update(ship) {
    const gp = navigator.getGamepads ? navigator.getGamepads()[this.index] : null;
    const it = ship.intent; if (!gp) { it.mx = it.my = 0; it.fire = false; it.aim = false; return; }
    const dz = v => Math.abs(v) < 0.18 ? 0 : v;
    it.mx = dz(gp.axes[0]); it.my = dz(gp.axes[1]);
    const ax = dz(gp.axes[2] || 0), ay = dz(gp.axes[3] || 0);
    it.aim = (ax * ax + ay * ay) > 0.1; it.ax = ax; it.ay = ay;
    it.fire = (gp.buttons[7] && gp.buttons[7].value > 0.4) || (gp.buttons[5] && gp.buttons[5].pressed) || it.aim && (gp.buttons[0] && gp.buttons[0].pressed);
  }
};
controllers.push(kbm, pad);

// AI: dumb state machine. HUNT -> STRAFE at orbit distance -> RETREAT when low hp.
function aiUpdate(ship, dt) {
  const ai = ship.ai, it = ship.intent;
  ai.think -= dt;
  if (ai.think <= 0) {
    ai.think = T.aiThink;
    // pick nearest living enemy
    let best = null, bd = Infinity;
    for (const o of S.ships) if (o.alive && o.team !== ship.team) {
      const [dx, dy] = delta(ship.x, ship.y, o.x, o.y); const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = o; }
    }
    ai.target = best;
    const d = Math.sqrt(bd);
    const wantRetreat = ship.hp <= T.aiRetreatHp && ship.hp < T.shipHp && ai.retreated < T.aiRetreatSec;
    if (wantRetreat) ai.state = 'RETREAT';
    else if (d < T.aiRange) ai.state = 'STRAFE';
    else ai.state = 'HUNT';
    ai.aimA = (rand() - 0.5) * 2 * T.aiAim * 0.5; // per-decision aim wobble (deg)
  }
  if (ai.state === 'RETREAT') ai.retreated += dt;
  const tgt = ai.target;
  it.fire = false; it.aim = false; it.mx = it.my = 0;
  if (!tgt || !tgt.alive) return;
  const [dx, dy] = delta(ship.x, ship.y, tgt.x, tgt.y);
  const d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
  // lead the target
  const tof = d / T.laserSpeed * T.aiLead;
  const [ldx, ldy] = [dx + (tgt.vx - ship.vx) * tof, dy + (tgt.vy - ship.vy) * tof];
  const wob = ai.aimA * Math.PI / 180, ca = Math.cos(wob), sa = Math.sin(wob);
  it.ax = ldx * ca - ldy * sa; it.ay = ldx * sa + ldy * ca; it.aim = true;
  if (ai.state === 'HUNT') { it.mx = nx; it.my = ny; }
  else if (ai.state === 'STRAFE') {
    const side = (ship.id % 2 ? 1 : -1);
    const radial = (d - T.aiOrbit) / T.aiOrbit; // + means too far
    it.mx = -ny * side + nx * radial; it.my = nx * side + ny * radial;
  } else { it.mx = -nx; it.my = -ny; }
  // asteroid avoidance: steer away from nearest asteroid inside aiAvoid
  if (T.aiAvoid > 0) {
    grid.query(ship.x, ship.y, T.aiAvoid, qbuf);
    for (const o of qbuf) if (o.kind === 'ast') {
      const [ex, ey] = delta(ship.x, ship.y, o.x, o.y); const ed = Math.hypot(ex, ey) - o.r;
      if (ed < T.aiAvoid) { const w = 1.5 * (1 - ed / T.aiAvoid); it.mx -= ex / (ed + o.r) * w; it.my -= ey / (ed + o.r) * w; }
    }
  }
  // fire if roughly aligned & in range
  const want = Math.atan2(it.ay, it.ax);
  if (d < T.aiRange * 1.2 && Math.abs(angDiff(ship.a, want)) < T.aiAim * Math.PI / 180) it.fire = true;
}

// ------------------------------------------------------------- SIM STEP
const DT = 1 / 120;
function step(dt) {
  S.t += dt;
  const t0 = performance.now();
  // grid: ships + asteroids
  grid.clear();
  for (const a of S.asteroids) grid.insert(a);
  for (const s of S.ships) if (s.alive) grid.insert(s);

  // --- controllers / AI
  const tAi = performance.now();
  for (const s of S.ships) {
    if (!s.alive) continue;
    if (s.ctrl) s.ctrl.update(s); else aiUpdate(s, dt);
  }
  perf.ai += performance.now() - tAi;

  // --- ships physics
  for (const s of S.ships) {
    if (!s.alive) continue;
    const it = s.intent;
    let ml = Math.hypot(it.mx, it.my); if (ml > 1) { it.mx /= ml; it.my /= ml; ml = 1; }
    s.vx += it.mx * T.thrust * dt; s.vy += it.my * T.thrust * dt;
    const k = Math.exp(-T.drag * dt); s.vx *= k; s.vy *= k;
    const sp = Math.hypot(s.vx, s.vy); if (sp > T.maxSpeed) { s.vx *= T.maxSpeed / sp; s.vy *= T.maxSpeed / sp; }
    // facing: aim dir if aiming, else move dir
    let want = null;
    if (it.aim && (it.ax || it.ay)) want = Math.atan2(it.ay, it.ax); else if (ml > 0.1) want = Math.atan2(it.my, it.mx);
    if (want != null) { const d = angDiff(s.a, want), mx = T.turnRate * dt; s.a += Math.abs(d) < mx ? d : Math.sign(d) * mx; }
    s.x += s.vx * dt; s.y += s.vy * dt; wrap(s);
    s.r = T.shipRadius;
    s.cd -= dt; s.hitFlash -= dt;
    if (it.fire && s.cd <= 0) {
      s.cd = T.fireCooldown;
      const a = s.a + (rand() - 0.5) * T.laserSpread * Math.PI / 180;
      S.lasers.push({ x: s.x + Math.cos(s.a) * s.r, y: s.y + Math.sin(s.a) * s.r, vx: Math.cos(a) * T.laserSpeed + s.vx * 0.3, vy: Math.sin(a) * T.laserSpeed + s.vy * 0.3, life: T.laserLife, team: s.team, owner: s });
      s.vx -= Math.cos(s.a) * T.recoil * dt * 10; s.vy -= Math.sin(s.a) * T.recoil * dt * 10;
    }
  }
  // --- asteroids
  for (const a of S.asteroids) { a.x += a.vx * dt; a.y += a.vy * dt; a.a += a.spin * dt; wrap(a); }

  // --- collisions
  const tCol = performance.now();
  // asteroid-asteroid & asteroid-ship (elastic-ish push)
  for (let i = 0; i < S.asteroids.length; i++) {
    const a = S.asteroids[i];
    grid.query(a.x, a.y, a.r, qbuf);
    for (const o of qbuf) {
      if (o === a || (o.kind === 'ast' && S.asteroids.indexOf(o) < i)) continue;
      if (o.kind === 'ship' && !o.alive) continue;
      const [dx, dy] = delta(a.x, a.y, o.x, o.y); const d = Math.hypot(dx, dy), min = a.r + o.r;
      if (d >= min || d === 0) continue;
      const nx = dx / d, ny = dy / d, pen = min - d;
      const ma = a.r * a.r, mo = o.kind === 'ast' ? o.r * o.r : o.r * o.r * 0.6, tot = ma + mo;
      a.x -= nx * pen * (mo / tot); a.y -= ny * pen * (mo / tot); o.x += nx * pen * (ma / tot); o.y += ny * pen * (ma / tot);
      const rvx = o.vx - a.vx, rvy = o.vy - a.vy, vn = rvx * nx + rvy * ny;
      if (vn < 0) {
        const j = -(1 + T.astBounce) * vn / (1 / ma + 1 / mo);
        a.vx -= j * nx / ma; a.vy -= j * ny / ma; o.vx += j * nx / mo; o.vy += j * ny / mo;
        if (o.kind === 'ship' && -vn > 120) spawnParticles(o.x, o.y, 4, '#aab', 80, 0.3);
      }
    }
  }
  // lasers
  for (let i = S.lasers.length - 1; i >= 0; i--) {
    const l = S.lasers[i];
    l.x += l.vx * dt; l.y += l.vy * dt; l.life -= dt; wrap(l);
    let dead = l.life <= 0;
    if (!dead) {
      grid.query(l.x, l.y, 4, qbuf);
      for (const o of qbuf) {
        if (o.kind === 'ship' && (!o.alive || o.team === l.team)) continue;
        const [dx, dy] = delta(l.x, l.y, o.x, o.y);
        if (dx * dx + dy * dy < o.r * o.r) {
          dead = true;
          if (o.kind === 'ship') {
            o.hp--; o.hitFlash = 0.12; o.vx += l.vx * 0.04; o.vy += l.vy * 0.04;
            spawnParticles(l.x, l.y, 6, TEAMS[l.team].color, 160, 0.35);
            if (o.hp <= 0) { o.alive = false; l.owner.kills++; spawnParticles(o.x, o.y, 40, TEAMS[o.team].color, 260, 0.9); S.shake = T.screenShake; }
          } else spawnParticles(l.x, l.y, 3, '#889', 90, 0.3);
          break;
        }
      }
    }
    if (dead) { S.lasers[i] = S.lasers[S.lasers.length - 1]; S.lasers.pop(); }
  }
  perf.col += performance.now() - tCol;

  // particles
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96;
    if (p.life <= 0) { S.parts[i] = S.parts[S.parts.length - 1]; S.parts.pop(); }
  }
  S.shake *= Math.exp(-8 * dt);

  // --- match state
  const m = S.match;
  if (!m.over) {
    const alive = [0, 0]; for (const s of S.ships) if (s.alive) alive[s.team]++;
    if (alive[0] === 0 || alive[1] === 0) {
      m.over = true; m.duration = S.t; m.winner = alive[0] ? 0 : alive[1] ? 1 : -1; m.restartIn = T.matchRestartSec;
      if (!S.headless) showBanner(m.winner < 0 ? 'DRAW' : TEAMS[m.winner].name.toUpperCase() + ' WINS  ·  ' + m.duration.toFixed(1) + 's', m.winner < 0 ? '#ccc' : TEAMS[m.winner].color);
    }
  } else if (!S.headless) {
    m.restartIn -= dt; if (m.restartIn <= 0) startMatch();
  }
  perf.sim += performance.now() - t0;
}

// ------------------------------------------------------------- RENDER
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let view = { s: 1, ox: 0, oy: 0 };
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  view.s = Math.min(innerWidth / WORLD.w, innerHeight / WORLD.h) * dpr;
  view.ox = (cv.width - WORLD.w * view.s) / 2; view.oy = (cv.height - WORLD.h * view.s) / 2;
}
addEventListener('resize', resize); resize();
const stars = []; { const r = mulberry32(7); for (let i = 0; i < 220; i++) stars.push({ x: r() * WORLD.w, y: r() * WORLD.h, b: r() }); }
let debug = false, showPerf = false;

function drawShip(s) {
  const c = TEAMS[s.team], r = s.r;
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
  // thruster
  const it = s.intent, ml = Math.hypot(it.mx, it.my);
  if (ml > 0.05) {
    const back = Math.atan2(it.my, it.mx) - s.a;
    ctx.save(); ctx.rotate(back + Math.PI);
    ctx.fillStyle = 'rgba(255,200,120,0.85)';
    ctx.beginPath(); ctx.moveTo(r * 0.5, -r * 0.35); ctx.lineTo(r * (0.9 + ml * 0.9 + rand() * 0.3), 0); ctx.lineTo(r * 0.5, r * 0.35); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.lineWidth = 2; ctx.strokeStyle = s.hitFlash > 0 ? '#fff' : c.color; ctx.fillStyle = s.hitFlash > 0 ? '#fff' : c.dim;
  ctx.beginPath(); ctx.moveTo(r * 1.3, 0); ctx.lineTo(-r * 0.8, r * 0.9); ctx.lineTo(-r * 0.4, 0); ctx.lineTo(-r * 0.8, -r * 0.9); ctx.closePath(); ctx.fill(); ctx.stroke();
  // cockpit dot
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * 0.3, 0, r * 0.18, 0, TAU); ctx.fill();
  ctx.restore();
  // hp pips
  ctx.fillStyle = c.color;
  for (let i = 0; i < s.hp; i++) ctx.fillRect(s.x - (T.shipHp * 5) / 2 + i * 5, s.y + r + 6, 4, 3);
  if (s.ctrl) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(s.x, s.y, r + 7, 0, TAU); ctx.stroke(); }
  if (debug) {
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU); ctx.stroke();
    if (!s.ctrl && s.ai.target && s.ai.target.alive) {
      const [dx, dy] = delta(s.x, s.y, s.ai.target.x, s.ai.target.y);
      ctx.strokeStyle = s.ai.state === 'RETREAT' ? '#f55' : s.ai.state === 'STRAFE' ? '#5f5' : '#ff5'; ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + dx, s.y + dy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = ctx.strokeStyle; ctx.font = '11px monospace'; ctx.fillText(s.ai.state, s.x + r + 4, s.y - r);
    }
  }
}
function render() {
  const t0 = performance.now();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#07080c'; ctx.fillRect(0, 0, cv.width, cv.height);
  const shx = (rand() - 0.5) * S.shake, shy = (rand() - 0.5) * S.shake;
  ctx.setTransform(view.s, 0, 0, view.s, view.ox + shx * view.s, view.oy + shy * view.s);
  // arena
  ctx.fillStyle = '#0b0d14'; ctx.fillRect(0, 0, WORLD.w, WORLD.h);
  for (const st of stars) { ctx.fillStyle = `rgba(200,210,255,${0.15 + st.b * 0.5})`; ctx.fillRect(st.x, st.y, 1.5, 1.5); }
  ctx.strokeStyle = '#1b2030'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
  // asteroids
  ctx.strokeStyle = '#8a92a8'; ctx.fillStyle = '#1a1e2a'; ctx.lineWidth = 2;
  for (const a of S.asteroids) {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.a); ctx.beginPath();
    for (let i = 0; i < a.pts.length; i++) { const an = i / a.pts.length * TAU, rr_ = a.r * a.pts[i]; i ? ctx.lineTo(Math.cos(an) * rr_, Math.sin(an) * rr_) : ctx.moveTo(Math.cos(an) * rr_, Math.sin(an) * rr_); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  // lasers
  ctx.lineCap = 'round';
  for (const l of S.lasers) {
    const len = 14, nx = l.vx / T.laserSpeed, ny = l.vy / T.laserSpeed;
    ctx.strokeStyle = TEAMS[l.team].color; ctx.lineWidth = 3; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.moveTo(l.x - nx * len, l.y - ny * len); ctx.lineTo(l.x, l.y); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(l.x - nx * len * 0.5, l.y - ny * len * 0.5); ctx.lineTo(l.x, l.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // particles
  for (const p of S.parts) { ctx.globalAlpha = p.life / p.maxLife; ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;
  for (const s of S.ships) if (s.alive) drawShip(s);
  perf.render += performance.now() - t0;
}

// ------------------------------------------------------------- HUD / UI
const hud = document.getElementById('hud'), banner = document.getElementById('banner');
function showBanner(txt, color) { banner.textContent = txt; banner.style.color = color; banner.classList.add('show'); }
function hideBanner() { banner.classList.remove('show'); }
let hudTimer = 0;
function updateHud(dt) {
  hudTimer -= dt; if (hudTimer > 0) return; hudTimer = 0.2;
  const alive = [0, 0]; for (const s of S.ships) if (s.alive) alive[s.team]++;
  let h = `<span style="color:${TEAMS[0].color}">${TEAMS[0].name} ${alive[0]}</span> vs <span style="color:${TEAMS[1].color}">${TEAMS[1].name} ${alive[1]}</span> &nbsp;<span class="dim">${S.t.toFixed(0)}s</span>`;
  if (showPerf || tuneOpen) h += `<br><span class="dim">${perf.fps.toFixed(0)} fps · frame ${perf.frameAvg.toFixed(2)}ms · sim ${perf.simAvg.toFixed(2)} (ai ${perf.aiAvg.toFixed(2)}, col ${perf.colAvg.toFixed(2)}) · render ${perf.renderAvg.toFixed(2)} · ${S.lasers.length} lasers ${S.parts.length} parts</span>`;
  const human = S.ships.find(s => s.ctrl);
  h += `<br><span class="dim">${human ? 'you: ' + human.ctrl.name + ' → ' + TEAMS[human.team].name + ' ship' : 'spectating · press 1 to possess'}  ·  T tuning</span>`;
  hud.innerHTML = h;
}

// tuning panel
const tune = document.getElementById('tune'), rows = document.getElementById('tuneRows'), presetSel = document.getElementById('presetSel');
let tuneOpen = false;
function buildPanel() {
  rows.innerHTML = ''; let group = null;
  for (const m of META) {
    if (m.group !== group) { group = m.group; const h = document.createElement('h3'); h.textContent = group; rows.appendChild(h); }
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label title="${m.key}">${m.key}</label><input type="range" min="${m.min}" max="${m.max}" step="${m.step}"><input type="number" min="${m.min}" max="${m.max}" step="${m.step}">`;
    const [rng, num] = row.querySelectorAll('input');
    rng.value = num.value = T[m.key];
    const set = v => { T[m.key] = +v; rng.value = num.value = +v; saveTuning(); };
    rng.oninput = () => set(rng.value); num.onchange = () => set(num.value);
    m.el = { rng, num }; rows.appendChild(row);
  }
  refreshPresets();
}
function refreshPanel() { for (const m of META) if (m.el) m.el.rng.value = m.el.num.value = T[m.key]; }
function refreshPresets() { presetSel.innerHTML = Object.keys(PRESETS).map(k => `<option>${k}</option>`).join(''); }
presetSel.onchange = () => { resetTuning(); applyTuning(PRESETS[presetSel.value]); refreshPanel(); saveTuning(); };
document.getElementById('btnSave').onclick = () => { const n = prompt('Preset name'); if (!n) return; const d = tuningJSON(); const diff = {}; for (const m of META) if (d[m.key] !== m.def) diff[m.key] = d[m.key]; PRESETS[n] = diff; refreshPresets(); presetSel.value = n; saveTuning(); };
document.getElementById('btnReset').onclick = () => { resetTuning(); refreshPanel(); saveTuning(); presetSel.value = 'default'; };
document.getElementById('btnCopy').onclick = () => { const s = JSON.stringify(tuningJSON(), null, 1); navigator.clipboard?.writeText(s); console.log(s); };
document.getElementById('btnRestart').onclick = () => startMatch();
function toggleTune(force) { tuneOpen = force ?? !tuneOpen; tune.classList.toggle('open', tuneOpen); }

// perf strip
const perfBox = document.getElementById('perf');
perfBox.innerHTML = '<div id="perfTxt"></div><canvas id="perfCv" width="300" height="44"></canvas>';
const perfTxt = document.getElementById('perfTxt'), perfCv = document.getElementById('perfCv'), pctx = perfCv.getContext('2d');
function drawPerf() {
  if (!tuneOpen) return;
  perfTxt.textContent = `${perf.fps.toFixed(0)} fps  frame ${perf.frameAvg.toFixed(2)}ms  sim ${perf.simAvg.toFixed(2)}  ai ${perf.aiAvg.toFixed(2)}  col ${perf.colAvg.toFixed(2)}  render ${perf.renderAvg.toFixed(2)}`;
  pctx.clearRect(0, 0, 300, 44);
  pctx.strokeStyle = '#2a3447'; pctx.beginPath(); pctx.moveTo(0, 44 - 16.67 * 2); pctx.lineTo(300, 44 - 16.67 * 2); pctx.stroke(); // 16.7ms line
  for (let i = 0; i < perf.hist.length; i++) {
    const v = perf.hist[(perf.hi + i) % perf.hist.length]; const h = Math.min(44, v * 2);
    pctx.fillStyle = v > 16.7 ? '#ff6b5a' : v > 8 ? '#ffc85a' : '#5ab0ff'; pctx.fillRect(i * 2.5, 44 - h, 2, h);
  }
}

// ------------------------------------------------------------- INPUT
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  keys[e.code] = true;
  if (e.code === 'KeyT') toggleTune();
  if (e.code === 'Escape') toggleTune(false);
  if (e.code === 'KeyH') debug = !debug;
  if (e.code === 'KeyP') showPerf = !showPerf;
  if (e.code === 'KeyR') startMatch();
  if (e.code === 'Digit1') togglePossess(kbm, 0);
  if (e.code === 'Digit2') togglePossess(pad, 1);
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
function toScreen(e) { const dpr = cv.width / innerWidth; mouse.x = (e.clientX * dpr - view.ox) / view.s; mouse.y = (e.clientY * dpr - view.oy) / view.s; }
cv.addEventListener('mousemove', toScreen);
cv.addEventListener('mousedown', e => { if (e.button === 0) { mouse.down = true; toScreen(e); } });
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('gamepadconnected', e => { pad.index = e.gamepad.index; if (pad.wantsShip == null) togglePossess(pad, 1); });
function togglePossess(ctrl, team) {
  const cur = S.ships.find(s => s.ctrl === ctrl);
  if (cur) { cur.ctrl = null; ctrl.wantsShip = null; return; }
  const s = S.ships.find(s => s.team === team && s.alive && !s.ctrl) || S.ships.find(s => s.team === team && !s.ctrl);
  if (s) { s.ctrl = ctrl; ctrl.wantsShip = team; }
}

// ------------------------------------------------------------- MAIN LOOP (fixed timestep)
let last = performance.now(), acc = 0;
perf.frameAvg = perf.simAvg = perf.aiAvg = perf.colAvg = perf.renderAvg = 0;
function frame(now) {
  const ft = Math.min(0.1, (now - last) / 1000); last = now; acc += ft;
  const f0 = performance.now();
  perf.sim = perf.ai = perf.col = perf.render = 0;
  let steps = 0;
  while (acc >= DT && steps < 8) { step(DT); acc -= DT; steps++; }
  if (steps === 8) acc = 0;
  render();
  const fms = performance.now() - f0;
  perfPush(fms);
  // moving averages
  const k = 0.1;
  perf.frameAvg += (fms - perf.frameAvg) * k; perf.simAvg += (perf.sim - perf.simAvg) * k; perf.aiAvg += (perf.ai - perf.aiAvg) * k;
  perf.colAvg += (perf.col - perf.colAvg) * k; perf.renderAvg += (perf.render - perf.renderAvg) * k;
  perf._acc += ft; perf._n++; if (perf._acc >= 0.5) { perf.fps = perf._n / perf._acc; perf._acc = 0; perf._n = 0; }
  updateHud(ft); drawPerf();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------- HEADLESS / VALIDATION API
// window.__game.simulateMatch(seed, maxSeconds, tuningOverrides?) -> {winner, duration, seed, timedOut, kills:[..]}
window.__game = {
  T, META, S, PRESETS, startMatch, step, applyTuning, resetTuning, tuningJSON,
  simulateMatch(seed, maxSeconds = 300, overrides) {
    const saved = tuningJSON();
    if (overrides) applyTuning(overrides);
    S.headless = true; startMatch(seed);
    const maxSteps = Math.ceil(maxSeconds / DT); let n = 0;
    while (!S.match.over && n++ < maxSteps) step(DT);
    const res = { seed, winner: S.match.winner, duration: S.match.over ? S.match.duration : S.t, timedOut: !S.match.over,
      alive: [0, 1].map(t => S.ships.filter(s => s.team === t && s.alive).length) };
    S.headless = false; applyTuning(saved);
    return res;
  }
};

// ------------------------------------------------------------- BOOT
const params = new URLSearchParams(location.search);
loadTuning(); buildPanel();
if (params.has('headless')) { S.headless = true; startMatch(1); }
else { startMatch(); requestAnimationFrame(frame); }
</script>
