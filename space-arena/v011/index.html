function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const PRESETS = {
  default: {},
  floaty:  { thrust: 260, drag: 0.25, maxSpeed: 480, turnRate: 4 },
  arcade:  { thrust: 900, drag: 3.5, maxSpeed: 420, turnRate: 14, fireCooldown: 0.12, laserSpeed: 1000 },
  sniper:  { fireCooldown: 0.6, laserSpeed: 1400, laserLife: 2, laserSpread: 0, aiRange: 600, aiOrbit: 450, aiAim: 4 },
};
function applyTuning(obj) { for (const m of META) if (obj[m.key] !== undefined) T[m.key] = +obj[m.key]; }
function resetTuning() { for (const m of META) T[m.key] = m.def; }
function tuningJSON() { const o = {}; for (const m of META) o[m.key] = T[m.key]; return o; }
const LS_KEY = GAME_ID + '.tuning';
function loadTuning() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s) { applyTuning(s.values || {}); Object.assign(PRESETS, s.presets || {}); }
  } catch (e) {}
}
function saveTuning() {
  try {
    const custom = {}; for (const k in PRESETS) if (!['default','floaty','arcade','sniper'].includes(k)) custom[k] = PRESETS[k];
    localStorage.setItem(LS_KEY, JSON.stringify({ values: tuningJSON(), presets: custom }));
  } catch (e) {}
}

// -------------------------------------------------------------- PERF
const perf = { frame: 0, sim: 0, ai: 0, col: 0, render: 0, hist: new Float32Array(120), hi: 0, fps: 0, _acc: 0, _n: 0 };
function perfPush(ms) { perf.hist[perf.hi] = ms; perf.hi = (perf.hi + 1) % perf.hist.length; }

// ------------------------------------------------------------ SPATIAL HASH
class Grid {
  constructor(cell) { this.cell = cell; this.map = new Map(); }
  clear() { this.map.clear(); }
  key(x, y) { return ((x / this.cell) | 0) * 73856093 ^ ((y / this.cell) | 0) * 19349663; }
  insert(e) {
    const r = e.r, c = this.cell;
    const x0 = ((e.x - r) / c) | 0, x1 = ((e.x + r) / c) | 0, y0 = ((e.y - r) / c) | 0, y1 = ((e.y + r) / c) | 0;
    for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
      const k = gx * 73856093 ^ gy * 19349663;
      let b = this.map.get(k); if (!b) this.map.set(k, b = []); b.push(e);
    }
  }
  query(x, y, r, out) {
    out.length = 0; const c = this.cell;
    const x0 = ((x - r) / c) | 0, x1 = ((x + r) / c) | 0, y0 = ((y - r) / c) | 0, y1 = ((y + r) / c) | 0;
    for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
      const b = this.map.get(gx * 73856093 ^ gy * 19349663); if (!b) continue;
      for (let i = 0; i < b.length; i++) if (out.indexOf(b[i]) < 0) out.push(b[i]);
    }
    return out;
  }
}

  G: { name: 'shotgun', color: '#ffb347', weapon: 'shotgun' }, R: { name: 'rockets', color: '#ff6b6b', weapon: 'rocket' }, M: { name: 'mines', color: '#c3a6ff', weapon: 'mine' },
  K: { name: 'seekers', color: '#6bffd3', weapon: 'homing' }, B: { name: 'beam', color: '#ffffff', weapon: 'beam' },

// clip = shots per clip, reload = seconds, cd = seconds between shots. Laser clip/reload are tunable (T.laserClip/T.laserReload).
const WEAPONS = {
  laser:   { name: 'LASER',   clip: 6, reload: 1.4, cd: 0.22 },
  shotgun: { name: 'SHOTGUN', clip: 2, reload: 2.4, cd: 1.0 },

};
function wdef(s) { const w = WEAPONS[s.weapon], st = s.stat || { clip: 0, reload: 1 }; return s.weapon === 'laser' ? { ...w, clip: T.laserClip + st.clip, reload: T.laserReload * st.reload, cd: T.fireCooldown } : { ...w, reload: w.reload * st.reload }; }
function giveWeapon(s, type) { s.weapon = type; const w = wdef(s); s.ammo = w.clip; s.reserve = type === 'laser' ? Infinity : w.clip * (T.weaponClips - 1); s.reload = 0; s.charge = 0; }
function startReload(s) { const w = wdef(s); if (s.reload > 0 || s.ammo >= w.clip || s.reserve <= 0) return; s.reload = w.reload; s.reloadMax = w.reload; }
// spawn anchors (fractions of arena) per team count
function teamSpawn(team, n) {
  if (n === 2) return [[0.3, 0.5], [0.7, 0.5]][team];
  if (n === 3) return [[0.25, 0.3], [0.75, 0.3], [0.5, 0.78]][team];
  return [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]][team];
}
const S = { ships: [], lasers: [], asteroids: [], parts: [], pups: [], rings: [], nextPup: 0, droneTimer: 0, barrelTimer: 0, t: 0, match: null, shake: 0, hitstop: 0, dilate: 0, zoom: 1, focus: null };
const grid = new Grid(80);
const qbuf = [];

// wrap (toroidal) or bounce off walls, per T.wrap. Returns true if a laser should die (hit wall).
function wrap(e) {
  if (T.wrap) {
    if (e.x < 0) e.x += WORLD.w; else if (e.x >= WORLD.w) e.x -= WORLD.w;
    if (e.y < 0) e.y += WORLD.h; else if (e.y >= WORLD.h) e.y -= WORLD.h;
    return false;
  }
  const r = e.r || 0; let hit = false;

      ctx.strokeStyle = strobe ? '#fff' : lit ? '#ff3030' : '#c0c8d8'; ctx.fillStyle = strobe ? '#fff' : lit ? '#5a1010' : '#1a1e2a'; ctx.lineWidth = 2; ctx.beginPath();
      for (let i = 0; i < 16; i++) { const an = i / 16 * TAU, rr_ = i % 2 ? a.r : a.r * 0.6; i ? ctx.lineTo(Math.cos(an) * rr_, Math.sin(an) * rr_) : ctx.moveTo(Math.cos(an) * rr_, Math.sin(an) * rr_); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = lit ? '#ff6060' : '#ff3030'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
      ctx.restore(); continue;
    }
    if (a.barrel) { // explosive barrel: orange drum with hazard stripe
      ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.a); const f = a.flash > 0;
      ctx.fillStyle = f ? '#fff' : '#b5541c'; ctx.strokeStyle = f ? '#fff' : '#ffb060'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(-11, -15, 22, 30, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = f ? '#ddd' : '#2a1a0a'; ctx.fillRect(-11, -4, 22, 8); ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill();
      for (let i = 0; i < a.hp; i++) { ctx.fillStyle = '#ffb060'; ctx.fillRect(-9 + i * 7, 10, 5, 2); }
      ctx.restore(); continue;
    }
    if (a.volatile) { const pulse = 0.5 + 0.5 * Math.sin(S.t * 5 + a.r); ctx.strokeStyle = `rgba(255,${110 + pulse * 60 | 0},60,1)`; ctx.fillStyle = `rgba(${60 + pulse * 40 | 0},22,18,1)`; }
    else { ctx.strokeStyle = '#8a92a8'; ctx.fillStyle = '#1a1e2a'; }
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.a); ctx.beginPath();
    for (let i = 0; i < a.pts.length; i++) { const an = i / a.pts.length * TAU, rr_ = a.r * a.pts[i]; i ? ctx.lineTo(Math.cos(an) * rr_, Math.sin(an) * rr_) : ctx.moveTo(Math.cos(an) * rr_, Math.sin(an) * rr_); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if (a.volatile) { ctx.fillStyle = 'rgba(255,170,80,0.9)'; ctx.beginPath(); ctx.arc(0, 0, a.r * 0.22, 0, TAU); ctx.fill(); }
    const cracks = a.maxHp - a.hp;
    if (cracks > 0) {
      ctx.strokeStyle = 'rgba(200,210,230,0.55)'; ctx.lineWidth = 1.2; ctx.beginPath();
      for (let k = 0; k < cracks; k++) {
        const an = a.seed + k * 2.39996, r0 = a.r * (0.15 + ((a.seed * (k + 1)) % 1) * 0.25), r1 = a.r * 0.95, mid = an + 0.35 * (k % 2 ? 1 : -1);
        ctx.moveTo(Math.cos(an) * r0, Math.sin(an) * r0); ctx.lineTo(Math.cos(mid) * (r0 + r1) / 2, Math.sin(mid) * (r0 + r1) / 2); ctx.lineTo(Math.cos(an) * r1, Math.sin(an) * r1);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // powerups: hex with letter
  for (const u of S.pups) {
    const c = POWERUPS[u.type].color, bob = Math.sin(S.t * 3 + u.born) * 2, fade = Math.min(1, u.life / 2);
    ctx.save(); ctx.translate(u.x, u.y + bob); ctx.globalAlpha = fade; ctx.rotate(S.t * 0.8);
    ctx.strokeStyle = c; ctx.fillStyle = 'rgba(10,14,22,0.9)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 6; i++) { const an = i / 6 * TAU; i ? ctx.lineTo(Math.cos(an) * u.r, Math.sin(an) * u.r) : ctx.moveTo(Math.cos(an) * u.r, Math.sin(an) * u.r); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.rotate(-S.t * 0.8);
    drawIcon(u.type, c, 7);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // blast rings (expanding AoE circle)
  for (const g of S.rings) { const k = 1 - g.life / g.max; ctx.strokeStyle = g.color; ctx.lineWidth = 3 + 6 * (1 - k); ctx.globalAlpha = 0.9 * (1 - k); ctx.beginPath(); ctx.arc(g.x, g.y, g.R * (0.3 + 0.7 * Math.sqrt(k)), 0, TAU); ctx.stroke();
    ctx.fillStyle = g.color; ctx.globalAlpha = 0.25 * (1 - k); ctx.fill(); }
  ctx.globalAlpha = 1;
  // mine proximity indicators
  for (const l of S.lasers) if (l.type === 'mine' && l.arm <= 0 && !l.chase) { ctx.strokeStyle = TEAMS[l.team].color; ctx.globalAlpha = 0.12 + 0.08 * Math.sin(S.t * 6); ctx.lineWidth = 1; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(l.x, l.y, T.mineTrigger, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
  ctx.globalAlpha = 1;
  // lasers
  ctx.lineCap = 'round';
  // lasers/pellets: saber look — wide soft team-colored glow layers under a hot white core, batched per team per layer
  const layers = T.laserGlow ? [[11, 0.14], [6, 0.35], [3, 0.9]] : [[3, 0.9]];
  for (let tm = 0; tm < TEAMS.length; tm++) {
    for (const [w, al] of layers) {
      ctx.strokeStyle = TEAMS[tm].color; ctx.lineWidth = w; ctx.globalAlpha = al; ctx.beginPath();
      for (const l of S.lasers) { if (l.team !== tm || (l.type !== 'laser' && l.type !== 'pellet')) continue; const sp = Math.hypot(l.vx, l.vy) || 1, len = l.type === 'pellet' ? 7 : 16; ctx.moveTo(l.x - l.vx / sp * len, l.y - l.vy / sp * len); ctx.lineTo(l.x, l.y); }
      ctx.stroke();
    }
  }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.95; ctx.beginPath();
  for (const l of S.lasers) { if (l.type !== 'laser' && l.type !== 'pellet') continue; const sp = Math.hypot(l.vx, l.vy) || 1, len = l.type === 'pellet' ? 5 : 12; ctx.moveTo(l.x - l.vx / sp * len, l.y - l.vy / sp * len); ctx.lineTo(l.x, l.y); }
  ctx.stroke(); ctx.globalAlpha = 1;
  // heavy projectiles
  for (const l of S.lasers) {
    if (l.type === 'laser' || l.type === 'pellet') continue;
    const c = TEAMS[l.team].color, ang = Math.atan2(l.vy, l.vx);
    ctx.save(); ctx.translate(l.x, l.y);
    if (l.type === 'beam') {
      ctx.rotate(ang); const len = 140;
      ctx.lineCap = 'round'; ctx.strokeStyle = c; ctx.lineWidth = 34; ctx.globalAlpha = 0.14; ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(0, 0); ctx.stroke();
      ctx.lineWidth = 16; ctx.globalAlpha = 0.4; ctx.stroke(); ctx.lineWidth = 7; ctx.globalAlpha = 0.8; ctx.stroke(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.globalAlpha = 1; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
    } else if (l.type === 'rocket') {
      ctx.rotate(ang); ctx.fillStyle = 'rgba(255,170,80,0.9)'; ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(-13 - rand() * 6, 0); ctx.lineTo(-6, 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = c; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, 4); ctx.lineTo(-5, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (l.type === 'homing') {
      ctx.rotate(ang); ctx.fillStyle = c; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(0, 4); ctx.lineTo(-5, 0); ctx.lineTo(0, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (l.type === 'mine') {
      const armed = l.arm <= 0, blink = armed && Math.sin(S.t * 10) > 0;
      ctx.rotate(S.t * 2); ctx.strokeStyle = c; ctx.fillStyle = '#1a1e2a'; ctx.lineWidth = 2; ctx.beginPath();
      for (let i = 0; i < 8; i++) { const an = i / 8 * TAU, rr_ = i % 2 ? 7 : 4; i ? ctx.lineTo(Math.cos(an) * rr_, Math.sin(an) * rr_) : ctx.moveTo(Math.cos(an) * rr_, Math.sin(an) * rr_); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = blink ? '#ff4040' : armed ? '#602020' : '#888'; ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, TAU); ctx.fill();
      if (debug && armed) { ctx.strokeStyle = 'rgba(255,80,80,.3)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, T.mineTrigger, 0, TAU); ctx.stroke(); }
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // particles
  for (const p of S.parts) { ctx.globalAlpha = p.life / p.maxLife; ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;
  S.leader = killLeader();
  for (const s of S.ships) if (s.alive) drawShip(s);
  // screen flash (beam)
  if (S.flash > 0) { ctx.fillStyle = '#fff'; ctx.globalAlpha = S.flash * 0.8; ctx.fillRect(0, 0, WORLD.w, WORLD.h); ctx.globalAlpha = 1; }
  // virtual sticks (screen space)
  ctx.setTransform(1, 0, 0, 1, 0, 0); const dpr = cv.width / innerWidth;
  for (const side of ['L', 'R']) {
    const st = touch[side]; if (!st) continue; const R = touch.radius * dpr;
    if (side === 'R' && inputMode === 'button') { ctx.fillStyle = 'rgba(255,120,120,0.45)'; ctx.beginPath(); ctx.arc(st.x0 * dpr, st.y0 * dpr, R * 0.6, 0, TAU); ctx.fill(); continue; }
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(st.x0 * dpr, st.y0 * dpr, R, 0, TAU); ctx.stroke();
    const hs = S.ships.find(q => q.ctrl); ctx.fillStyle = side === 'R' && hs && hs.assistTgt ? 'rgba(255,120,120,0.8)' : 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc((st.x0 + st.dx * touch.radius) * dpr, (st.y0 + st.dy * touch.radius) * dpr, R * 0.4, 0, TAU); ctx.fill();
  }
  perf.render += performance.now() - t0;
}

// ------------------------------------------------------------- HUD / UI
const hud = document.getElementById('hud'), banner = document.getElementById('banner');
function showBanner(txt, color) { banner.textContent = txt; banner.style.color = color; banner.classList.add('show'); }
function hideBanner() { banner.classList.remove('show'); }
let hudTimer = 0;
function updateHud(dt) {
  hudTimer -= dt; if (hudTimer > 0) return; hudTimer = 0.2;
  const alive = new Array(T.teams).fill(0); for (const s of S.ships) if (s.alive && !s.drone) alive[s.team]++;
  const kills = new Array(T.teams).fill(0); for (const s of S.ships) if (!s.drone) kills[s.team] += s.kills;
  let h = `<span class="dim">${VERSION}</span> &nbsp;` + alive.map((n, i) => `<span style="color:${TEAMS[i].color}">${TEAMS[i].name} ${n}<span class="dim">·${kills[i]}k</span></span>`).join(' <span class="dim">·</span> ') + ` &nbsp;<span class="dim">${S.t.toFixed(0)}s</span>`;
  const ld = S.leader; if (ld) h += ` &nbsp;<span style="color:#ffd700">♛ ${TEAMS[ld.team].name} ${ld.kills}</span>`;
  if (showPerf || tuneOpen) h += `<br><span class="dim">${perf.fps.toFixed(0)} fps · frame ${perf.frameAvg.toFixed(2)}ms · sim ${perf.simAvg.toFixed(2)} (ai ${perf.aiAvg.toFixed(2)}, col ${perf.colAvg.toFixed(2)}) · render ${perf.renderAvg.toFixed(2)} · ${S.lasers.length} lasers ${S.parts.length} parts</span>`;
  const human = S.ships.find(s => s.ctrl);
  h += `<br><span class="dim">${human ? 'you: ' + TEAMS[human.team].name + (human.alive ? ` · hp ${human.hp}${human.shield ? ' · shield ' + human.shield : ''}${human.boost > 0 ? ' · BOOST' : ''} · ${wdef(human).name} ${human.reload > 0 ? 'RELOADING' : human.charge > 0 ? 'CHARGING' : human.ammo + '/' + wdef(human).clip}${isFinite(human.reserve) ? ' (+' + human.reserve + ')' : ''}${' · gun ★' + human.rank} · spd ${human.stat.speed.toFixed(2)} proj ${human.stat.pspeed.toFixed(2)} clip+${human.stat.clip} rel ${human.stat.reload.toFixed(2)} dmg+${human.stat.dmg}` : ' · eliminated') : (IS_TOUCH ? 'spectating · Possess to play' : 'spectating · press 1 to possess')}${IS_TOUCH ? '' : '  ·  T tuning'}</span>`;
  hud.innerHTML = h;
}

// tuning panel
const tune = document.getElementById('tune'), rows = document.getElementById('tuneRows'), presetSel = document.getElementById('presetSel');
let tuneOpen = false;
function buildPanel() {
  rows.innerHTML = ''; let group = null;
  for (const m of META) {
    if (m.group !== group) { group = m.group; const h = document.createElement('h3'); h.textContent = group; rows.appendChild(h); }
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label title="${m.key}">${m.key}</label><input type="range" min="${m.min}" max="${m.max}" step="${m.step}"><input type="number" min="${m.min}" max="${m.max}" step="${m.step}">`;
    const [rng, num] = row.querySelectorAll('input');
    rng.value = num.value = T[m.key];
    const set = v => { T[m.key] = +v; rng.value = num.value = +v; saveTuning(); };
    rng.oninput = () => set(rng.value); num.onchange = () => set(num.value);
    m.el = { rng, num }; rows.appendChild(row);
  }
  refreshPresets();
}
function refreshPanel() { for (const m of META) if (m.el) m.el.rng.value = m.el.num.value = T[m.key]; }
function refreshPresets() { presetSel.innerHTML = Object.keys(PRESETS).map(k => `<option>${k}</option>`).join(''); }
presetSel.onchange = () => { resetTuning(); applyTuning(PRESETS[presetSel.value]); refreshPanel(); saveTuning(); };
document.getElementById('btnSave').onclick = () => { const n = prompt('Preset name'); if (!n) return; const d = tuningJSON(); const diff = {}; for (const m of META) if (d[m.key] !== m.def) diff[m.key] = d[m.key]; PRESETS[n] = diff; refreshPresets(); presetSel.value = n; saveTuning(); };
document.getElementById('btnReset').onclick = () => { resetTuning(); refreshPanel(); saveTuning(); presetSel.value = 'default'; };
document.getElementById('btnCopy').onclick = () => { const s = JSON.stringify(tuningJSON(), null, 1); navigator.clipboard?.writeText(s); console.log(s); };
document.getElementById('btnRestart').onclick = () => startMatch();
function toggleTune(force) { tuneOpen = force ?? !tuneOpen; tune.classList.toggle('open', tuneOpen); }

// perf strip
const perfBox = document.getElementById('perf');
perfBox.innerHTML = '<div id="perfTxt"></div><canvas id="perfCv" width="300" height="44"></canvas>';
const perfTxt = document.getElementById('perfTxt'), perfCv = document.getElementById('perfCv'), pctx = perfCv.getContext('2d');
function drawPerf() {
  if (!tuneOpen) return;
  perfTxt.textContent = `${perf.fps.toFixed(0)} fps  frame ${perf.frameAvg.toFixed(2)}ms  sim ${perf.simAvg.toFixed(2)}  ai ${perf.aiAvg.toFixed(2)}  col ${perf.colAvg.toFixed(2)}  render ${perf.renderAvg.toFixed(2)}`;
  pctx.clearRect(0, 0, 300, 44);
  pctx.strokeStyle = '#2a3447'; pctx.beginPath(); pctx.moveTo(0, 44 - 16.67 * 2); pctx.lineTo(300, 44 - 16.67 * 2); pctx.stroke(); // 16.7ms line
  for (let i = 0; i < perf.hist.length; i++) {
    const v = perf.hist[(perf.hi + i) % perf.hist.length]; const h = Math.min(44, v * 2);
    pctx.fillStyle = v > 16.7 ? '#ff6b5a' : v > 8 ? '#ffc85a' : '#5ab0ff'; pctx.fillRect(i * 2.5, 44 - h, 2, h);
  }
}

// ------------------------------------------------------------- INPUT
addEventListener('keydown', e => {
  audioInit();
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  keys[e.code] = true;
  if (e.code === 'KeyT') toggleTune();
  if (e.code === 'Escape') toggleTune(false);
  if (e.code === 'KeyH') debug = !debug;
  if (e.code === 'KeyP') showPerf = !showPerf;
  if (e.code === 'Enter') startMatch();
  if (e.code === 'Digit1') togglePossess(kbm, 0);
  if (e.code === 'Digit2') togglePossess(pad, 1);
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
function toScreen(e) { const dpr = cv.width / innerWidth; mouse.x = (e.clientX * dpr - view.ox) / view.s; mouse.y = (e.clientY * dpr - view.oy) / view.s; }
cv.addEventListener('mousemove', toScreen);
cv.addEventListener('mousedown', e => { audioInit(); if (e.button === 0) { mouse.down = true; toScreen(e); } });
addEventListener('mouseup', e => { if (e.button === 0) { if (mouse.down) kbm.released = true; mouse.down = false; } });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('gamepadconnected', e => { pad.index = e.gamepad.index; if (pad.wantsShip == null) togglePossess(pad, 1); });
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return; audioInit();
  const side = e.clientX < innerWidth / 2 ? 'L' : 'R';
  touch[side] = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 }; cv.setPointerCapture?.(e.pointerId);
});
function stickMove(e) {
  for (const side of ['L', 'R']) { const st = touch[side]; if (!st || st.id !== e.pointerId) continue;
    let dx = (e.clientX - st.x0) / touch.radius, dy = (e.clientY - st.y0) / touch.radius; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    st.dx = dx; st.dy = dy; }
}
cv.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') stickMove(e); });
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, e => { for (const side of ['L', 'R']) if (touch[side] && touch[side].id === e.pointerId) { if (side === 'R' && inputMode === 'fling' && Math.hypot(touch.R.dx, touch.R.dy) > 0.12) touch.flung = { dx: touch.R.dx, dy: touch.R.dy }; touch[side] = null; } });
const humanCtrl = () => IS_TOUCH ? touch : kbm;
document.getElementById('bPossess').onclick = () => { audioInit(); if (!S.ships.find(s => s.ctrl === humanCtrl())) togglePossess(humanCtrl(), 0); };
document.getElementById('bSpectate').onclick = () => { for (const c of controllers) { const cur = S.ships.find(s => s.ctrl === c); if (cur) cur.ctrl = null; c.wantsShip = null; } };
document.getElementById('bRestart').onclick = () => { audioInit(); startMatch(); };
document.getElementById('bTune').onclick = () => toggleTune();
document.getElementById('bInput').onclick = () => setInputMode(INPUT_MODES[(INPUT_MODES.indexOf(inputMode) + 1) % INPUT_MODES.length]);
setInputMode(inputMode);
function togglePossess(ctrl, team) {
  const cur = S.ships.find(s => s.ctrl === ctrl);
  if (cur) { cur.ctrl = null; ctrl.wantsShip = null; return; }
  const s = S.ships.find(s => s.team === team && s.alive && !s.ctrl) || S.ships.find(s => s.team === team && !s.ctrl);
  if (s) { s.ctrl = ctrl; ctrl.wantsShip = team; }
}

// ------------------------------------------------------------- MAIN LOOP (fixed timestep)
let last = performance.now(), acc = 0;
document.addEventListener('visibilitychange', () => { if (!document.hidden) { last = performance.now(); acc = 0; } });
perf.frameAvg = perf.simAvg = perf.aiAvg = perf.colAvg = perf.renderAvg = 0;
function frame(now) {
  const ft = Math.min(0.1, (now - last) / 1000); last = now;
  // juice clock: hitstop freezes sim; dilation slows it; both in real seconds
  let scale = 1;
  if (S.hitstop > 0) { S.hitstop -= ft; scale = 0; }
  else if (S.dilate > 0) { S.dilate -= ft; const k = Math.min(1, S.dilate / (T.dilateSec * 0.35)); scale = T.dilateScale + (1 - T.dilateScale) * (1 - k); }
  acc += ft * scale;
  const zt = S.dilate > 0 ? T.elimZoom : 1; S.zoom += (zt - S.zoom) * Math.min(1, T.zoomEase * ft);
  if (S.dilate <= 0 && Math.abs(S.zoom - 1) < 0.005) { S.zoom = 1; S.focus = null; }
  const f0 = performance.now();
  perf.sim = perf.ai = perf.col = perf.render = 0;
  let steps = 0;
  while (acc >= DT && steps < 8) { step(DT); acc -= DT; steps++; }
  if (steps === 8) acc = 0;
  if (scale === 0) S.shake *= Math.exp(-8 * ft);
  S.flash = Math.max(0, (S.flash || 0) - ft);
  render();
  const fms = performance.now() - f0;
  perfPush(fms);
  // moving averages
  const k = 0.1;
  perf.frameAvg += (fms - perf.frameAvg) * k; perf.simAvg += (perf.sim - perf.simAvg) * k; perf.aiAvg += (perf.ai - perf.aiAvg) * k;
  perf.colAvg += (perf.col - perf.colAvg) * k; perf.renderAvg += (perf.render - perf.renderAvg) * k;
  perf._acc += ft; perf._n++; if (perf._acc >= 0.5) { perf.fps = perf._n / perf._acc; perf._acc = 0; perf._n = 0; }
  updateHud(ft); drawPerf();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------- HEADLESS / VALIDATION API
// window.__game.simulateMatch(seed, maxSeconds, tuningOverrides?) -> {winner, duration, seed, timedOut, kills:[..]}
window.__game = {
  T, META, S, PRESETS, startMatch, step, applyTuning, resetTuning, tuningJSON,
  simulateMatch(seed, maxSeconds = 300, overrides) {
    const saved = tuningJSON();
    if (overrides) applyTuning(overrides);
    const human = controllers.map(c => c.wantsShip); controllers.forEach(c => c.wantsShip = null); // AI only
    S.headless = true; startMatch(seed);
    const maxSteps = Math.ceil(maxSeconds / DT); let n = 0;
    while (!S.match.over && n++ < maxSteps) step(DT);
    const res = { seed, winner: S.match.winner, duration: S.match.over ? S.match.duration : S.t, timedOut: !S.match.over,
      alive: [...Array(T.teams).keys()].map(t => S.ships.filter(s => s.team === t && s.alive && !s.drone).length) };
    S.headless = false; applyTuning(saved); controllers.forEach((c, i) => c.wantsShip = human[i]);
    return res;
  }
};

// ------------------------------------------------------------- BOOT
const params = new URLSearchParams(location.search);
loadTuning(); buildPanel();
if (params.has('headless')) { S.headless = true; startMatch(1); }
else { if (!IS_TOUCH) kbm.wantsShip = 0; startMatch(); requestAnimationFrame(frame); }
</script>
