function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

    while (!S.match.over && n++ < maxSteps) step(DT);
    const res = { seed, winner: S.match.winner, duration: S.match.over ? S.match.duration : S.t, timedOut: !S.match.over,
      alive: [...Array(T.teams).keys()].map(t => S.ships.filter(s => s.team === t && s.alive && !s.drone).length) };
    S.headless = false; applyTuning(saved); controllers.forEach((c, i) => c.wantsShip = human[i]);
    return res;
  }
};

loadTuning(); buildPanel();
if (params.has('headless')) { S.headless = true; startMatch(1); }
else { if (!IS_TOUCH) kbm.wantsShip = 0; startMatch(); requestAnimationFrame(frame); }
